<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Fonts are linked here rather than @import-ed from index.css on purpose.
      A remote @import inside CSS serialises four render-blocking round trips
      (HTML -> our CSS -> Google's CSS -> the font files); a <link> in the head
      lets the browser start the font request during HTML parse instead.
      preconnect warms the DNS/TLS handshake to both Google origins ahead of
      that. Weights are trimmed to the ones the code actually uses -- note
      `1,900`, which the outlined italic "DIGITAL" in the hero needs; without
      it the browser synthesises a faux-bold italic for that word.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;0,700;0,900;1,900&family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@700&display=swap"
    />

    <title><!-- figma:title --></title>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
